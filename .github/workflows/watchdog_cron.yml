name: AI Watchdog Cron Job

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  
  # Enables manual "Run workflow" button in GitHub Actions tab
  workflow_dispatch: 

jobs:
  run-watchdog:
    name: Run Twilio SRE & Arch Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Execute Watchdog Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python twilio_watchdog.py

      # --- COMMIT DATA BACK TO GITHUB DATABASE ---
      - name: Commit and Push Database Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchdog_alerts.json
          # The '|| exit 0' ensures the action stays green even if no new alerts were found
          git commit -m "Automated SRE database update [skip ci]" || exit 0
          git push
