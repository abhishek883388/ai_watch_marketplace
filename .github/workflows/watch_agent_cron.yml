name: AI Watch Agent Cron Job

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  
  # Enables manual "Run workflow" button in GitHub Actions tab
  workflow_dispatch: 

jobs:
  run-watchdog:
    name: Run AI Watch Agent SRE & Arch Analysis
    runs-on: ubuntu-latest
    
    # Explicitly grant write access to contents
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Execute Watch Agent Scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python twilio_watch_agent.py
          python jumio_watch_agent.py
          python entrust_watch_agent.py
      

      - name: Install Zendesk dependencies
        run: |
          pip install requests python-dotenv openai feedparser beautifulsoup4   

      - name: Run Zendesk Watch Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
        run: python zendesk_watch_agent.py

      - name: Fetch Resolved Incidents Archive
        run: python fetch_resolved_incidents.py

      # --- COMMIT DATA BACK TO GITHUB DATABASE ---
      - name: Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watch_agent_alerts.csv watch_agent_resolved_incidents.csv
          git commit -m "Automated SRE database update [skip ci]" || exit 0
          git push
